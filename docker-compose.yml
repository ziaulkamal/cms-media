# docker-compose.yml — layanan dev lokal (PostgreSQL; Redis disiapkan utk fase berikutnya).
services:
  postgres:
    image: postgres:16-alpine
    container_name: cms_media_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cms_media
    ports:
      - "5432:5432"
    volumes:
      - cms_media_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cms_media"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Disiapkan untuk cache/rate-limit/refresh-token (aktifkan saat dibutuhkan).
  # redis:
  #   image: redis:7-alpine
  #   container_name: cms_media_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"

volumes:
  cms_media_pgdata:
